<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Canción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/discord.css">


</head>
<body>

    <div class="container">
        <h2>Selecciona una Canción</h2>
        <ul id="songList" class="list-group mb-3">
            <!-- Canciones cargadas desde el JSON -->
        </ul>

        <h4>Canción seleccionada:</h4>
        <p id="selectedSong" class="fw-bold">Ninguna</p>

        <label for="channelId" class="form-label">Canal de Discord (ID):</label>
        <input type="text" id="channelId" class="form-control mb-3">
        

        <button class="btn btn-primary w-100">Enviar Canción</button>
    </div>

    <script src="../JS/discord.js"></script>


</body>
</html>
